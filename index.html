<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nomadinho — Blaqbonez</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230a0a09%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23ff4d1a%27/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#0a0a09" />
  <script>try{if(localStorage.getItem("theme")==="light"){document.documentElement.dataset.theme="lights-out";document.querySelector('meta[name=theme-color]').content="#ece6da"}}catch(e){}</script>
  <meta name="description" content="Nomadinho — the new era from Blaqbonez, Chocolate City / 4th Prime." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Fruktur&family=Germania+One&family=Grenze+Gotisch:wght@700&family=Metamorphous&family=Pirata+One&family=Rye&family=Sancreek&family=UnifrakturMaguntia&display=block" />
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Fruktur&family=Germania+One&family=Grenze+Gotisch:wght@700&family=Metamorphous&family=Pirata+One&family=Rye&family=Sancreek&family=UnifrakturMaguntia&family=Inter+Tight:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" /></noscript>
</head>
<body>
  <a class="skip" href="#hero">Skip to content</a>
  <header class="header" id="header">
    <a class="header__logo" href="#hero" aria-label="Blaqbonez, home">Blaqbonez</a>
    <nav class="header__nav ui-label" aria-label="Primary">
      <a href="#hero" data-scramble>Home</a>
      <a href="#gallery" data-scramble>Discography</a>
      <a href="#footer" data-scramble>Contact</a>
    </nav>
    <div class="header__right ui-label">
      <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Light mode" aria-keyshortcuts="Shift" title="Light / dark (Shift)">
        <span class="theme-toggle__track" aria-hidden="true">
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 16 16"><path d="M13.2 10.3A5.6 5.6 0 0 1 5.7 2.8a5.6 5.6 0 1 0 7.5 7.5Z"/></svg>
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M13 3l-1.4 1.4M4.4 11.6 3 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
          <span class="theme-toggle__thumb"></span>
        </span>
      </button>
      <span>Lagos <time class="clock" data-clock>--:--:--</time></span>
    </div>
  </header>

  <main id="hero" class="hero" tabindex="-1"></main>
  <section id="gallery" class="gallery" aria-label="Discography" tabindex="-1"></section>
  <footer id="footer" class="footer" tabindex="-1"></footer>

  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading Nomadinho">
    <div class="loader__photos" id="loaderPhotos" aria-hidden="true"></div>
    <div class="loader__centre" id="loaderCentre">
      <p class="wordmark wordmark--loader" id="loaderWordmark" role="img" aria-label="Nomadinho"></p>
      <div class="loader__progress">
        <div class="loader__track"><div class="loader__bar" id="loaderBar"></div></div>
        <span class="loader__pct ui-label" id="loaderPct">000%</span>
      </div>
    </div>
    <div class="loader__meta ui-label">
      <span>Blaqbonez</span>
      <span>Loading the experience</span>
      <span>Lagos <time class="clock" data-clock>--:--:--</time></span>
    </div>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
